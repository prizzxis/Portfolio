<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#101010"/>

  <!-- Dot grid -->
  <g fill="#262626">
    <circle cx="100" cy="100" r="4"/><circle cx="200" cy="100" r="4"/><circle cx="300" cy="100" r="4"/>
    <circle cx="100" cy="200" r="4"/><circle cx="200" cy="200" r="4"/><circle cx="300" cy="200" r="4"/>
    <circle cx="900" cy="700" r="4"/><circle cx="1000" cy="700" r="4"/><circle cx="1100" cy="700" r="4"/>
    <circle cx="900" cy="800" r="4"/><circle cx="1000" cy="800" r="4"/><circle cx="1100" cy="800" r="4"/>
  </g>

  <!-- Concentric rings -->
  <circle cx="600" cy="450" r="360" fill="none" stroke="#222" stroke-width="1.5"/>
  <circle cx="600" cy="450" r="300" fill="none" stroke="#2c2c2c" stroke-width="1.5"/>
  <circle cx="600" cy="450" r="240" fill="none" stroke="#363636" stroke-width="1.5"/>
  <circle cx="600" cy="450" r="180" fill="none" stroke="#484848" stroke-width="1.5"/>
  <circle cx="600" cy="450" r="120" fill="none" stroke="#5c5c5c" stroke-width="1.5"/>

  <!-- Spokes -->
  <g stroke="#262626" stroke-width="1">
    <line x1="600" y1="90" x2="600" y2="810"/>
    <line x1="240" y1="450" x2="960" y2="450"/>
    <line x1="345" y1="195" x2="855" y2="705"/>
    <line x1="855" y1="195" x2="345" y2="705"/>
  </g>

  <!-- Orbit dots -->
  <circle cx="600" cy="210" r="16" fill="#EDEDED"/>
  <circle cx="600" cy="210" r="16" fill="none" stroke="#EDEDED" stroke-width="1" opacity="0.4"/>
  <circle cx="940" cy="450" r="9" fill="#EDEDED" opacity="0.7"/>
  <circle cx="490" cy="660" r="6" fill="#EDEDED" opacity="0.45"/>
  <circle cx="700" cy="620" r="11" fill="#EDEDED" opacity="0.85"/>

  <!-- Cursor -->
  <g fill="#EDEDED">
    <path d="M180 620 L180 740 L232 688 L268 700 L286 656 L242 648 Z"/>
  </g>

  <!-- Crosshair on right -->
  <g stroke="#6f6f6f" stroke-width="2">
    <line x1="980" y1="180" x2="1020" y2="220"/>
    <line x1="1020" y1="180" x2="980" y2="220"/>
  </g>
  <circle cx="1000" cy="200" r="46" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- Bottom-left caption bars -->
  <rect x="60" y="760" width="240" height="14" rx="6" fill="#5c5c5c"/>
  <rect x="60" y="790" width="180" height="9" rx="4" fill="#363636"/>
</svg>
