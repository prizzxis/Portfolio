<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#101010"/>

  <!-- Nav -->
  <rect x="40" y="34" width="100" height="12" rx="4" fill="#EDEDED"/>
  <g fill="#6f6f6f">
    <rect x="820" y="37" width="46" height="9" rx="4"/>
    <rect x="890" y="37" width="60" height="9" rx="4"/>
    <rect x="974" y="37" width="52" height="9" rx="4"/>
  </g>
  <rect x="1060" y="24" width="100" height="34" rx="17" fill="none" stroke="#3a3a3a"/>
  <rect x="1082" y="37" width="56" height="9" rx="4" fill="#8a8a8a"/>

  <!-- Hero split -->
  <rect x="40" y="150" width="560" height="44" rx="8" fill="#EDEDED"/>
  <rect x="40" y="212" width="520" height="44" rx="8" fill="#EDEDED" opacity="0.7"/>
  <rect x="40" y="284" width="480" height="14" rx="6" fill="#5c5c5c"/>
  <rect x="40" y="316" width="420" height="14" rx="6" fill="#5c5c5c" opacity="0.6"/>
  <rect x="40" y="386" width="160" height="48" rx="24" fill="#EDEDED"/>
  <rect x="72" y="404" width="96" height="10" rx="5" fill="#101010"/>

  <rect x="660" y="150" width="500" height="340" rx="14" fill="#171717" stroke="#262626"/>
  <rect x="700" y="190" width="420" height="150" rx="10" fill="url(#patV)"/>
  <rect x="700" y="366" width="220" height="12" rx="5" fill="#EDEDED"/>
  <rect x="700" y="394" width="160" height="9" rx="4" fill="#5c5c5c"/>
  <rect x="956" y="356" width="120" height="34" rx="6" fill="none" stroke="#2c2c2c"/>
  <rect x="976" y="368" width="80" height="9" rx="4" fill="#6f6f6f"/>

  <!-- Metrics band -->
  <line x1="40" y1="580" x2="1160" y2="580" stroke="#222" stroke-width="1"/>
  <g>
    <rect x="40" y="616" width="140" height="26" rx="6" fill="#EDEDED"/>
    <rect x="40" y="656" width="110" height="9" rx="4" fill="#5c5c5c"/>
  </g>
  <g>
    <rect x="300" y="616" width="120" height="26" rx="6" fill="#EDEDED"/>
    <rect x="300" y="656" width="130" height="9" rx="4" fill="#5c5c5c"/>
  </g>
  <g>
    <rect x="560" y="616" width="160" height="26" rx="6" fill="#EDEDED"/>
    <rect x="560" y="656" width="120" height="9" rx="4" fill="#5c5c5c"/>
  </g>
  <g>
    <rect x="880" y="616" width="110" height="26" rx="6" fill="#EDEDED"/>
    <rect x="880" y="656" width="140" height="9" rx="4" fill="#5c5c5c"/>
  </g>
  <line x1="40" y1="712" x2="1160" y2="712" stroke="#222" stroke-width="1"/>

  <!-- Footer band -->
  <rect x="40" y="760" width="1120" height="100" rx="10" fill="#161616" stroke="#262626"/>
  <rect x="80" y="788" width="300" height="16" rx="6" fill="#EDEDED"/>
  <rect x="80" y="822" width="220" height="9" rx="4" fill="#5c5c5c"/>
  <rect x="900" y="778" width="120" height="34" rx="17" fill="#EDEDED"/>
  <rect x="928" y="792" width="64" height="9" rx="4" fill="#101010"/>

  <defs>
    <pattern id="patV" width="52" height="52" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="52" height="52" fill="#1c1c1c"/>
      <line x1="0" y1="0" x2="0" y2="52" stroke="#282828" stroke-width="1"/>
    </pattern>
  </defs>
</svg>
